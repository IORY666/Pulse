# XcodeGen 项目配置
# 在 Mac 上运行: brew install xcodegen && xcodegen generate

name: Gravity
options:
  bundleIdPrefix: com.gravity
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans
  preferredColorScheme: dark

settings:
  base:
    INFOPLIST_FILE: Gravity/Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.gravity.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""  # 留空，Xcode 自动使用 Personal Team
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

targets:
  Gravity:
    type: application
    platform: iOS
    sources:
      - Gravity
    settings:
      base:
        PRODUCT_NAME: Gravity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies: []
    preBuildScripts: []
    postBuildScripts: []
