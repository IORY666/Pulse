# Gravity App - XcodeGen 项目配置
name: Gravity
options:
  bundleIdPrefix: com.gravity
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Gravity:
    type: application
    platform: iOS
    sources:
      - path: Gravity
    settings:
      base:
        INFOPLIST_FILE: Gravity/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gravity.app
        PRODUCT_NAME: Gravity
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
