name: 构建 Gravity IPA

on:
  workflow_dispatch:
  push:
    branches: [gravity-build]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        working-directory: GravityApp
        run: xcodegen generate

      - name: 构建 (无签名 + 保存日志)
        working-directory: GravityApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project Gravity.xcodeproj \
            -scheme Gravity \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee ../build.log
          echo "BUILD_EXIT=$?" >> $GITHUB_ENV

      - name: 保存错误日志到仓库
        if: failure()
        run: |
          echo '```' > GravityApp/BUILD_ERROR.md
          echo '# Build Error Log' >> GravityApp/BUILD_ERROR.md
          tail -100 build.log >> GravityApp/BUILD_ERROR.md
          echo '```' >> GravityApp/BUILD_ERROR.md
          git config user.email "ci@gravity.app"
          git config user.name "Gravity CI"
          git add GravityApp/BUILD_ERROR.md
          git commit -m "构建错误日志" && git push origin gravity-build || true

      - name: 打包 IPA
        if: success()
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Gravity.app" -path "*/Release-iphoneos/*" | head -1)
          echo "App路径: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "找不到 .app 文件!"
            find ~/Library/Developer/Xcode/DerivedData -name "Gravity.app" 2>/dev/null
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Gravity.ipa Payload
          ls -lh Gravity.ipa

      - name: 上传 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gravity.ipa
          path: Gravity.ipa
          retention-days: 7
