name: 构建 Gravity IPA

on:
  workflow_dispatch:
  push:
    branches: [gravity-build]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        working-directory: GravityApp
        run: xcodegen generate

      - name: Archive 构建
        working-directory: GravityApp
        run: |
          xcodebuild archive \
            -project Gravity.xcodeproj \
            -scheme Gravity \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/Gravity.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 导出 IPA
        run: |
          cat > GravityApp/build/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string></string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath GravityApp/build/Gravity.xcarchive \
            -exportPath GravityApp/build/export \
            -exportOptionsPlist GravityApp/build/ExportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            || echo "Export with signing failed, trying manual packaging..."

          # 如果导出失败，手动打包
          APP_PATH=$(find GravityApp/build/Gravity.xcarchive -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Gravity.app" -path "*/Release-iphoneos/*" | head -1)
          fi
          echo "App: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/ 2>/dev/null || {
            echo "手动打包失败，尝试直接构建..."
            cd GravityApp
            xcodebuild build \
              -project Gravity.xcodeproj \
              -scheme Gravity \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -configuration Release \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
            cd ..
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Gravity.app" -path "*/Release-iphoneos/*" | head -1)
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
          }

          zip -r Gravity.ipa Payload
          ls -lh Gravity.ipa

      - name: 上传 IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gravity.ipa
          path: Gravity.ipa
          retention-days: 7
