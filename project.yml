# Pulse App - XcodeGen 项目配置
# 在任何平台上编辑此文件，推送到GitHub后
# GitHub Actions 会自动在 macOS 上生成 .xcodeproj 并构建
#
# 文档: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

name: Pulse
options:
  bundleIdPrefix: com.pulse
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans
  usesTabs: false
  tabWidth: 4
  indentWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

# ============================================================
# 主 App Target
# ============================================================
targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - path: Pulse
        excludes:
          - "Widget"
    settings:
      base:
        INFOPLIST_FILE: Pulse/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.habittracker
        PRODUCT_NAME: Pulse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "YES"
        SUPPORTED_PLATFORMS: iphonesimulator iphoneos
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - target: PulseWidget
    entitlements:
      path: Pulse/Pulse.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: []
        com.apple.developer.icloud-services: ["CloudKit"]
        com.apple.security.application-groups:
          - group.com.pulse.habittracker
        aps-environment: development

  # ============================================================
  # Widget Extension Target
  # ============================================================
  PulseWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Pulse/Widget
    settings:
      base:
        INFOPLIST_FILE: Pulse/Widget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.habittracker.widget
        PRODUCT_NAME: PulseWidget
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"
        SUPPORTED_PLATFORMS: iphonesimulator iphoneos
    entitlements:
      path: Pulse/Widget/PulseWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pulse.habittracker

# ============================================================
# 构建配置
# ============================================================
configs:
  Debug:
    type: debug
    settings:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      OTHER_SWIFT_FLAGS: "-DDEBUG"
  Release:
    type: release
    settings:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

# ============================================================
# 构建方案 (Schemes)
# ============================================================
schemes:
  Pulse:
    build:
      targets:
        Pulse: all
        PulseWidget: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
